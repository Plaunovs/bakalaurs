name: env_face_recognition
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.24.*
  - psutil=5.9.*
  - dlib=19.24.*          # conda-forge: iepriekš kompilēta bināra pakotne, cmake nav vajadzīgs
  - pip
  - pip:
      - setuptools==68.2.2
      - face-recognition==1.3.0
      - face_recognition_models>=0.3.0
      - opencv-python==4.8.1.78
